<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpendWise Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">$</span>
        <span class="brand-name">SpendWise</span>
      </div>

      <nav aria-label="Main navigation">
        <ul class="nav-list">
          <li><a class="nav-item active" href="#"><span aria-hidden="true">📊</span> Dashboard</a></li>
          <li><a class="nav-item" href="#"><span aria-hidden="true">💸</span> Transactions</a></li>
          <li><a class="nav-item" href="#"><span aria-hidden="true">🎯</span> Budgets</a></li>
          <li><a class="nav-item" href="#"><span aria-hidden="true">📈</span> Reports</a></li>
          <li><a class="nav-item" href="#"><span aria-hidden="true">⚙️</span> Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <h1>Dashboard</h1>
        <p id="current-month">Monthly overview</p>
      </div>
      <div class="header-actions">
        <button class="btn" type="button" id="header-add-btn">+ Add Expense</button>
        <div class="user">
          <span class="avatar" aria-hidden="true">JD</span>
          <span class="user-name">Jane Doe</span>
        </div>
      </div>
    </header>

    <!-- Main content -->
    <main class="main">

      <!-- Summary numbers (updated by JavaScript) -->
      <section class="stats" aria-label="Budget summary">
        <div class="stat">
          <p class="stat-label">Monthly Budget</p>
          <p class="stat-value" id="stat-budget">$0.00</p>
        </div>
        <div class="stat">
          <p class="stat-label">Total Spent</p>
          <p class="stat-value" id="stat-spent">$0.00</p>
        </div>
        <div class="stat">
          <p class="stat-label">Remaining</p>
          <p class="stat-value" id="stat-remaining">$0.00</p>
        </div>
      </section>

      <!-- Feedback message + progress bar (updated by JavaScript) -->
      <section class="feedback" id="feedback" role="status" aria-live="polite">
        <p class="feedback-text" id="feedback-text"></p>
        <div class="progress">
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </section>

      <!-- Forms -->
      <section class="panels" aria-label="Forms">
        <form class="panel" id="budget-form" novalidate>
          <h2>Monthly budget</h2>
          <div class="field">
            <label for="budget-input">Budget amount ($)</label>
            <input type="number" id="budget-input" min="0" step="0.01" placeholder="e.g. 2000" />
          </div>
          <button class="btn" type="submit">Set Budget</button>
          <p class="form-error" id="budget-error" role="alert"></p>
        </form>

        <form class="panel" id="expense-form" novalidate>
          <h2>Add an expense</h2>
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" placeholder="e.g. Lunch at the cafe" maxlength="60" />
          </div>
          <div class="field-row">
            <div class="field">
              <label for="amount">Amount ($)</label>
              <input type="number" id="amount" min="0" step="0.01" placeholder="0.00" />
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category"></select>
            </div>
          </div>
          <button class="btn" type="submit">Add Expense</button>
          <p class="form-error" id="expense-error" role="alert"></p>
        </form>
      </section>

      <!-- Category cards (created by JavaScript) -->
      <h2 class="section-title">Spending by category</h2>
      <section class="cards" id="category-cards" aria-label="Category cards"></section>

      <!-- Expense list (created by JavaScript) -->
      <h2 class="section-title">Expenses</h2>
      <section class="panel" aria-label="Expense list">
        <div class="panel-header">
          <p class="panel-note" id="expense-count"></p>
          <div class="panel-actions">
            <select id="filter-select" aria-label="Filter expenses by category"></select>
            <button class="btn btn-danger" type="button" id="clear-btn">Clear All</button>
          </div>
        </div>
        <ul class="expense-list" id="expense-list"></ul>
        <p class="empty" id="empty-message" hidden>No expenses to show. Add one above!</p>
      </section>

    </main>

  </div>
</body>
</html>
